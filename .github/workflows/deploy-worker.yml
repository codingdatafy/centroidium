name: Deploy Worker Engine

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js Environment
        # actions/setup-node@v4.1.0
        uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65
        with:
          node-version: 22
          cache: npm

      - name: Install Build Dependencies
        run: npm ci

      - name: Validate TypeScript Build
        run: npm run type-check

      - name: Deploy Worker via Wrangler
        # cloudflare/wrangler-action@v3.14.0
        uses: cloudflare/wrangler-action@b2e4ec15bc751d3822f36d4bcfa6fa22dd8e81e3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy