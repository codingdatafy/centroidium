name: Deploy Content Update to Cloudflare Pages

on:
  repository_dispatch:
    types: [content_updated]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ==========================================
      # Step 1: Environment Initialization
      # ==========================================
      - name: Checkout Engine Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify Environment Node Version
        run: |
          node -v
          npm -v

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      # ==========================================
      # Step 2: Content Injection (With Full Git History)
      # ==========================================
      - name: Clone Content Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: 'CodingDatafy/content'
          path: 'content-temp'
          token: ${{ secrets.CENTROIDIUM_PAT }}
          fetch-depth: 0 # Retains complete commit history

      - name: Inject Content into Engine Root
        run: |
          rm -rf data
          mkdir -p data
          if [ -d "content-temp/data" ]; then
            # Enable dotglob to include hidden files, then copy contents of data directory cleanly
            shopt -s dotglob
            cp -r content-temp/data/* data/
            # Also preserve .git history from repository root for commit timestamps
            cp -r content-temp/.git data/
            echo "Data workspace and Git history successfully injected."
            ls -la data
          else
            echo "Critical Error: Content workspace missing!" && exit 1
          fi
          rm -rf content-temp

      # ==========================================
      # Step 3: SSG Compilation & Cloudflare Pages Deployment
      # ==========================================
      - name: Download Cloudflare Beacon Script
        run: |
          mkdir -p public/scripts
          curl -s https://static.cloudflareinsights.com/beacon.min.js -o public/scripts/cf-beacon.js

      - name: Build Next.js Static Export (out)
        run: npm run build
        env:
          ORGANIZATION_GITHUB_TOKEN: ${{ secrets.CENTROIDIUM_PAT }}
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN }}

      - name: Deploy Out Directory to Cloudflare Pages Direct via CLI
        run: |
          npx wrangler pages project create codingdatafy --production-branch=main || true
          npx wrangler pages deploy out --project-name=codingdatafy --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}